name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - patient-service
          - billing-service
          - auth-service
          - analytic-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: '21'
            cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B verify

      # Job logs need a GitHub login; annotations are public. On failure, show each failed test class + its first
      # assertion/exception lines as an annotation, so a red run can be diagnosed from the run page or the API.
      - name: Report failed tests
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|ERROR" "$f"; then
              msg=$(grep -m4 -E "expected|Exception|Error|but was" "$f" | tr '\n' ' ' | cut -c1-600)
              echo "::error title=${{ matrix.service }} $(basename "$f" .txt)::${msg}"
            fi
          done



  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [ patient-service, billing-service, auth-service,
                   analytic-service, api-gateway ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
            context: ./${{ matrix.service }}
            push: true
            tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/pm-${{ matrix.service}}:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/pm-${{ matrix.service}}:${{github.sha}}