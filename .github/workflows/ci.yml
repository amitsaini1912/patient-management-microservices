name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - patient-service
          - billing-service
          - auth-service
          - analytic-service
          - api-gateway
          # Day 24a: in the repo since Days 7/10/11, never run in CI until now (78 tests)
          - card-vault
          - payment-network-simulator
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: '21'
            cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # JaCoCo from the command line (no plugin in the poms): agent before the tests, report after. Report only -
      # coverage never fails the build (decided Day 24a). Same command locally for an HTML report in
      # target/site/jacoco/index.html.
      - name: Build and run tests (with coverage)
        run: ./mvnw -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent verify org.jacoco:jacoco-maven-plugin:0.8.12:report

      - name: Coverage summary
        if: always()
        run: |
          [ -f target/site/jacoco/jacoco.csv ] || { echo "no coverage report"; exit 0; }
          python3 - "${{ matrix.service }}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, os, sys
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          # hand-written = classes with a source file; protobuf/gRPC code generated into target/ is counted apart
          mine = [r for r in rows if os.path.exists(
              f"src/main/java/{r['PACKAGE'].replace('.', '/')}/{r['CLASS'].split('.')[0]}.java")]
          def pct(rs, kind):
              hit = sum(int(r[f"{kind}_COVERED"]) for r in rs)
              total = hit + sum(int(r[f"{kind}_MISSED"]) for r in rs)
              return f"{100 * hit / total:.1f}% ({hit}/{total})" if total else "n/a"
          print(f"**{sys.argv[1]}** coverage: lines {pct(mine, 'LINE')}, branches {pct(mine, 'BRANCH')}"
                f" (hand-written; all classes incl. generated: lines {pct(rows, 'LINE')})")
          PY
          # annotations are public (logs need a login): the number is readable from the run page / API
          echo "::notice title=${{ matrix.service }} coverage::$(tail -1 "$GITHUB_STEP_SUMMARY" | sed 's/\*//g')"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore

      # Job logs need a GitHub login; annotations are public. On failure, show each failed test class + its first
      # assertion/exception lines as an annotation, so a red run can be diagnosed from the run page or the API.
      - name: Report failed tests
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|ERROR" "$f"; then
              msg=$(grep -m4 -E "expected|Exception|Error|but was" "$f" | tr '\n' ' ' | cut -c1-600)
              echo "::error title=${{ matrix.service }} $(basename "$f" .txt)::${msg}"
            fi
          done



  # ADR 0035: the .proto files copied between services describe the same wire contract (fails on drift)
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Proto copies match their owners
        run: python3 scripts/check-proto-copies.py

  # ADR 0032: the Prometheus alert rules parse and fire on the failures they are for (promtool unit tests)
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check config + alert rules, run the rule tests
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v2.55.1 check rules /m/alerts.yml
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v2.55.1 test rules /m/alerts.test.yml

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [ patient-service, billing-service, auth-service,
                   analytic-service, api-gateway ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
            context: ./${{ matrix.service }}
            push: true
            tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/pm-${{ matrix.service}}:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/pm-${{ matrix.service}}:${{github.sha}}