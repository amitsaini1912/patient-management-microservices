spring.application.name=analytic-service

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytic-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
# a new consumer group starts from the oldest event, so nothing published before our first start is missed
spring.kafka.consumer.auto-offset-reset=earliest
# the producer is only used to forward failed records to <topic>.DLT, unchanged
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
analytics.kafka.patient-topic=patient
analytics.kafka.payment-topic=payment.events
# a failing record is retried this many times, 1s apart, then sent to the DLT (bad data goes there at once)
analytics.kafka.retry-attempts=2
analytics.kafka.retry-interval=1s

# ---- Database (its own analytics DB). Password from env, never in code (see ../.env.example) ----
spring.datasource.url=${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5433/analytic-service-db}
spring.datasource.username=${ANALYTICS_DB_USER:admin_user}
spring.datasource.password=${ANALYTICS_DB_PASSWORD}

# ---- Flyway builds the schema; Hibernate only validates ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# see the SQL Hibernate runs (learning aid, like patient-service)
spring.jpa.show-sql=true
