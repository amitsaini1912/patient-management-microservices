spring.application.name=auth-service
server.port=4005

jwt.secret=${JWT_SECRET}

# ---- Day 20b (ADR 0020): metrics for Prometheus; JSON logs when LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs ----
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# histogram buckets, so Prometheus can compute p95/p99 across instances (histogram_quantile)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ---- ADR 0027: account lockout (the gateway also limits /auth/login per client IP) ----
auth.login.max-failures=5
auth.login.window=15m
auth.login.lock-for=15m
# No open-session-in-view: nothing here renders views or lazy-loads after the controller (the login also refreshes the
# user under its row lock, so it is correct either way - ADR 0027).
spring.jpa.open-in-view=false
