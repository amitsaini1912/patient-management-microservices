spring.application.name=billing-service

server.port=4001
grpc.server.port=9001

# ---- Database: values come from env (see .env.example). No password in code. ----
spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://localhost:5434/billing}
spring.datasource.username=${BILLING_DB_USER:billing}
spring.datasource.password=${BILLING_DB_PASSWORD}

# ---- Flyway builds the schema; Hibernate only validates it ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# don't keep a DB connection open while the HTTP response is being written
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,metrics
management.metrics.tags.application=${spring.application.name}

# ---- Payments ----
# uncaptured authorizations older than this are expired (and the hold released)
billing.payments.authorization-ttl=7d
billing.payments.expiry-batch-size=100
billing.payments.expiry-job.fixed-delay=PT5M

# ---- Idempotency (header Idempotency-Key on every POST /payments/**) ----
billing.idempotency.ttl=24h
# an IN_PROGRESS key older than this was abandoned (crash) and a retry may take it over
billing.idempotency.lock-timeout=60s
billing.idempotency.cleanup-fixed-delay=PT1H

# ---- Kafka + transactional outbox (ADR 0008) ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# every in-sync replica must have it before we mark the row SENT; idempotence = no duplicates from producer retries
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast when Kafka is down: the outbox row is the retry, so the producer needn't wait long.
# (defaults are 60s / 120s, which would hold the relay's DB transaction open that long)
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=6000
billing.events.payment-topic=payment.events
billing.events.partitions=3
billing.events.replicas=1
billing.outbox.poll-interval=PT0.5S
billing.outbox.batch-size=100
billing.outbox.initial-backoff=1s
billing.outbox.max-backoff=60s
billing.outbox.retention=7d
billing.outbox.cleanup-fixed-delay=PT1H

# ---- Acquirer = payment-network-simulator (ADR 0010). "fake" = in-memory FakePaymentProcessor (tests) ----
billing.processor=${BILLING_PROCESSOR:simulator}
billing.simulator.base-url=${SIMULATOR_URL:http://localhost:4010}
billing.simulator.api-key=${SIMULATOR_API_KEY:}
billing.simulator.connect-timeout=2s
billing.simulator.read-timeout=5s

# ---- Webhooks from the acquirer: POST /webhooks/gateway, HMAC-signed (ADR 0010) ----
billing.webhooks.gateway.secret=${GATEWAY_WEBHOOK_SECRET:}
# reject signatures older (or further in the future) than this: a captured request can't be replayed later
billing.webhooks.gateway.tolerance=5m

# ---- Reconciliation vs the acquirer's settlement report (ADR 0011): daily, for yesterday (UTC) ----
billing.reconciliation.cron=0 0 2 * * *

# ---- Multi-currency (ADR 0012): INR books, cards may be charged in USD/EUR; rate locked at authorization ----
billing.fx.book-currency=INR
billing.fx.supported-currencies=INR,USD,EUR
billing.fx.revaluation-cron=0 0 1 * * *

# ---- Card vault (ADR 0013): billing only reads token metadata; it never sees or stores a card number ----
billing.card-vault.mode=${BILLING_CARD_VAULT:http}
billing.card-vault.base-url=${CARD_VAULT_URL:http://localhost:4020}
billing.card-vault.api-key=${CARD_VAULT_KEY_BILLING:}
billing.card-vault.timeout=2s

# ---- Rate limit per card (ADR 0015): token bucket in Redis, keyed by card fingerprint ----
# 5 authorization attempts in a burst, then one more per minute. Over the limit -> 429 + Retry-After.
billing.rate-limit.card.enabled=true
billing.rate-limit.card.capacity=5
billing.rate-limit.card.refill-every=1m
# Docker/k8s: SPRING_DATA_REDIS_HOST=redis (same as patient-service)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Short: the limiter fails OPEN, so a slow Redis must cost a payment at most this, not Lettuce's 60s default
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
# Redis down is not "billing down" (we fail open): keep it out of /actuator/health
management.health.redis.enabled=false

# ---- Audit log (ADR 0016): hash chain keyed with HMAC-SHA256. Key from env, never in the DB; no default on purpose ----
# generate: openssl rand -base64 32. Changing it makes every existing row fail verification (no key rotation yet).
billing.audit.hmac-key=${BILLING_AUDIT_KEY:}

# ---- Risk check before authorization (Day 19, ADR 0017): POST /v2/assess on razorpay-risk-agent ----
# false = billing's own fallback rules only (the repo runs without the risk engine). Compose: BILLING_RISK_ENABLED=true
billing.risk.enabled=${BILLING_RISK_ENABLED:false}
billing.risk.base-url=${RISK_URL:http://localhost:8000}
billing.risk.api-key=${RISK_API_KEY_BILLING:}
# the whole check (one retry included) gets this long; then the payment goes on with the fallback rules
billing.risk.budget=300ms
billing.risk.min-attempt=50ms
billing.risk.merchant-id=hospital-main
# fallback rules, book currency minor units: hold for review from INR 50,000 (foreign-currency cards from INR 10,000)
billing.risk.fallback.hold-at-book-minor=5000000
billing.risk.fallback.foreign-hold-at-book-minor=1000000
# circuit breaker: open when half of the last 20 calls failed (at least 10 calls), test again after 30 s
billing.risk.circuit-breaker.window=20
billing.risk.circuit-breaker.minimum-calls=10
billing.risk.circuit-breaker.failure-rate=50
billing.risk.circuit-breaker.open-for=30s
