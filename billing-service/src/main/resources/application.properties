spring.application.name=billing-service

server.port=4001
grpc.server.port=9001

# ---- Database: values come from env (see .env.example). No password in code. ----
spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://localhost:5434/billing}
spring.datasource.username=${BILLING_DB_USER:billing}
spring.datasource.password=${BILLING_DB_PASSWORD}

# ---- Flyway builds the schema; Hibernate only validates it ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# don't keep a DB connection open while the HTTP response is being written
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,metrics
management.metrics.tags.application=${spring.application.name}

# ---- Payments ----
# uncaptured authorizations older than this are expired (and the hold released)
billing.payments.authorization-ttl=7d
billing.payments.expiry-batch-size=100
billing.payments.expiry-job.fixed-delay=PT5M

# ---- Idempotency (header Idempotency-Key on every POST /payments/**) ----
billing.idempotency.ttl=24h
# an IN_PROGRESS key older than this was abandoned (crash) and a retry may take it over
billing.idempotency.lock-timeout=60s
billing.idempotency.cleanup-fixed-delay=PT1H
