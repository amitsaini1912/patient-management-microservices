# Test overrides, layered ON TOP of src/main/resources/application.properties (config/ on purpose: a
# src/test/resources/application.properties would replace the main file - see analytic-service, Day 6b).

# in-memory fake acquirer instead of payment-network-simulator over HTTP
billing.processor=fake
billing.webhooks.gateway.secret=test-webhook-secret
# in-memory fake card vault: any token is a Visa ending 4242 (see FakeCardVaultClient)
billing.card-vault.mode=fake
# Most tests pay many times with the same test card: effectively no per-card limit here.
# CardRateLimitIntegrationTest sets small limits for itself.
billing.rate-limit.card.capacity=1000000
# audit chain key for tests only (32 bytes, base64)
billing.audit.hmac-key=dGVzdC1hdWRpdC1rZXktdGVzdC1hdWRpdC1rZXktMzI=
# Day 20b: Spring Boot tests switch metric export off by default; BillingMetricsIntegrationTest reads the real
# Prometheus registry (same for every test, so all ITs still share one context)
management.prometheus.metrics.export.enabled=true
