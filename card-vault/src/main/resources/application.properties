spring.application.name=card-vault
server.port=4020

# PSP-style API like the simulator: snake_case JSON
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health

# ---- Its own database (compose: vault-db on localhost:5436) ----
spring.datasource.url=${VAULT_DB_URL:jdbc:postgresql://localhost:5436/vault}
spring.datasource.username=${VAULT_DB_USER:vault}
spring.datasource.password=${VAULT_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Keys and callers: ALL from env (see ../.env.example), no defaults on purpose ----
# AES-256 keys by version: "1:<base64 32 bytes>,2:<base64 32 bytes>"; new cards use the active version
vault.encryption-keys=${VAULT_ENCRYPTION_KEYS}
vault.active-key-version=${VAULT_ACTIVE_KEY_VERSION:1}
vault.fingerprint-key=${VAULT_FINGERPRINT_KEY}

# who may call, with which X-Api-Key, for what
vault.clients.gateway.api-key=${CARD_VAULT_KEY_GATEWAY}
vault.clients.gateway.permissions=TOKENIZE
vault.clients.billing.api-key=${CARD_VAULT_KEY_BILLING}
vault.clients.billing.permissions=READ_METADATA
vault.clients.simulator.api-key=${CARD_VAULT_KEY_SIMULATOR}
vault.clients.simulator.permissions=DETOKENIZE

# never print request bodies or full error messages: they could contain a PAN
server.error.include-message=never
server.error.include-binding-errors=never
