# Local development stack. Grows one service at a time (see each day's notes).
#   cp .env.example .env      # then set real passwords
#   docker compose up -d billing-db kafka vault-db redis
#   docker compose up -d --build risk-engine     # Day 19: needs ../razorpay-risk-agent checked out next to this repo
#   docker compose up -d jaeger                  # Day 20a: traces at http://localhost:16686 (run Java services with
#                                                #   monitoring/otel/run-traced.sh to send theirs)
services:
  billing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: ${BILLING_DB_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env}
    ports:
      - "5434:5432"   # 5433 is already used by the local analytics DB
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BILLING_DB_USER:-billing} -d billing"]
      interval: 5s
      retries: 10

  # card-vault's own database: the only place card numbers are stored (encrypted). Separate from billing-db on
  # purpose: different credentials, different backups, the smallest possible PCI scope (ADR 0013).
  vault-db:
    image: postgres:16
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: ${VAULT_DB_USER:-vault}
      POSTGRES_PASSWORD: ${VAULT_DB_PASSWORD:?set VAULT_DB_PASSWORD in .env}
    ports:
      - "5436:5432"
    volumes:
      - vault-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VAULT_DB_USER:-vault} -d vault"]
      interval: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Same 3.9 line as k8s/kafka.yaml.
  #   from your machine:      localhost:9092
  #   from other containers:  kafka:19092
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  # Day 12: rate-limit buckets (api-gateway per user, billing per card). No named volume: buckets are short-lived.
  # (Redis still snapshots to the image's anonymous /data on a clean stop, so a restart keeps them; a crash may
  # reset limits - worst case a few extra attempts.)
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Day 19: the risk engine from the sibling repo (razorpay-risk-agent). billing-service on your machine calls it at
  # localhost:8000 when BILLING_RISK_ENABLED=true (ADR 0017). It keeps its own Redis DB (1; billing's rate limits use 0)
  # and consumes chargeback.created from this Kafka (its feedback loop, Day 18). The model is trained during the build.
  risk-engine:
    build: ../razorpay-risk-agent
    image: risk-engine:local
    environment:
      RISK_API_KEYS: billing:${RISK_API_KEY_BILLING:?set RISK_API_KEY_BILLING in .env}
      REDIS_URL: redis://redis:6379/1
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Day 20a: traces to Jaeger (billing's traceparent makes /v2/assess part of the payment's trace)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: risk-engine
    ports:
      - "8000:8000"
    volumes:
      - risk-data:/app/data     # decisions + chargeback labels (feedback loop)
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Day 20a (ADR 0019): trace store + UI, in memory (traces are gone after a restart). OTLP in: 4317 gRPC, 4318 HTTP.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"   # UI + query API
      - "4317:4317"
      - "4318:4318"

volumes:
  billing-db-data:
  vault-db-data:
  risk-data:
