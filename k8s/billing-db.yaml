apiVersion: v1
kind: Secret
metadata:
  name: billing-secrets
type: Opaque
stringData:
  postgres-password: "password"   # demo value, same pattern as patient-db; use a real secret store outside local k8s

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-db
spec:
  replicas: 1
  serviceName: billing-db-headless
  selector:
    matchLabels:
      app: billing-db
  template:
    metadata:
      labels:
        app: billing-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: billing
            - name: POSTGRES_DB
              value: billing
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: billing-db
spec:
  selector:
    app: billing-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: billing-db-headless
spec:
  clusterIP: None
  selector:
    app: billing-db
  ports:
    - port: 5432
