apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: amitsaini1912/pm-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001      # HTTP
            - containerPort: 9001      # gRPC
          env:
            - name: BILLING_DB_URL
              value: jdbc:postgresql://billing-db:5432/billing   # billing-db Service
            - name: BILLING_DB_USER
              value: billing
            - name: BILLING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: postgres-password
            - name: SPRING_DATA_REDIS_HOST
              value: redis                     # Day 12: per-card rate limit buckets (k8s/redis.yaml)
---
apiVersion: v1
kind: Service
metadata:
    name: billing-service
spec:
    selector:
      app: billing-service
    ports:
      - name: http                       # <- NEW: each port needs a name when there's >1
        port: 4001
        targetPort: 4001
      - name: grpc                       # <- NEW
        port: 9001
        targetPort: 9001