# OpenTelemetry agent settings for billing-service only (run-traced.sh picks up monitoring/otel/<service>.properties;
# the Dockerfile sets the same as env). ADR 0019.
# No span per @Scheduled run: the outbox relay polls every 0.5 s and each poll would be its own trace. The relay
# continues the REQUEST's trace for every event it publishes instead (outbox_event.trace_parent).
otel.instrumentation.spring-scheduling.enabled=false
