spring.application.name=payment-network-simulator
server.port=4010

# A PSP-style API: snake_case JSON (amount_minor, merchant_reference ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health

# ---- secrets from env (see ../.env.example); no defaults on purpose ----
simulator.api-key=${SIMULATOR_API_KEY}
simulator.webhooks.secret=${SIMULATOR_WEBHOOK_SECRET}

# billing-service's webhook endpoint
simulator.webhooks.target-url=${SIMULATOR_WEBHOOK_URL:http://localhost:4001/webhooks/gateway}
simulator.webhooks.delay=500ms
simulator.webhooks.max-attempts=5
simulator.webhooks.initial-backoff=1s

# ---- Day 11: card network + issuer (ADR 0014) ----
# The acquirer detokenizes billing's card token at card-vault (DETOKENIZE permission) to build the 0100.
# "fake" = no card-vault needed: pm_card_* test tokens stand for the issuer's test cards (see FakeCardVaultClient)
simulator.card-vault.mode=${SIMULATOR_CARD_VAULT:http}
simulator.card-vault.base-url=${CARD_VAULT_URL:http://localhost:4020}
simulator.card-vault.api-key=${CARD_VAULT_KEY_SIMULATOR:}
simulator.card-vault.timeout=2s
# No 0110 within this -> the network answers 91 and reverses. Keep it well below billing's 5s read timeout.
simulator.network.issuer-timeout=1s
# 1 USD/EUR = this many INR at the scheme (field 6 = cardholder billing amount); fixed, unlike a real scheme
simulator.network.scheme-rates.USD=83.50
simulator.network.scheme-rates.EUR=90.25
simulator.issuer.billing-currency=INR
# 10,00,000.00 INR on every card the issuer hasn't seen before
simulator.issuer.default-balance-minor=100000000
simulator.issuer.slow-response=3s
