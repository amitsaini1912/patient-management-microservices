spring.application.name=payment-network-simulator
server.port=4010

# A PSP-style API: snake_case JSON (amount_minor, merchant_reference ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health

# ---- secrets from env (see ../.env.example); no defaults on purpose ----
simulator.api-key=${SIMULATOR_API_KEY}
simulator.webhooks.secret=${SIMULATOR_WEBHOOK_SECRET}

# billing-service's webhook endpoint
simulator.webhooks.target-url=${SIMULATOR_WEBHOOK_URL:http://localhost:4001/webhooks/gateway}
simulator.webhooks.delay=500ms
simulator.webhooks.max-attempts=5
simulator.webhooks.initial-backoff=1s
